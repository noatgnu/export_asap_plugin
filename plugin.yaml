plugin:
  id: "export-asap"
  name: "Export ASAP"
  description: "Exports ASAP files from an SDRF file."
  version: "1.0.0"
  category: "utilities"
  repository: "https://github.com/noatgnu/export_asap_plugin"
runtime:
  environments: ["python"]
  entrypoint: "export_asap.py"

inputs:
  - name: "sdrf_file"
    label: "SDRF File"
    type: "file"
    required: true
    file_types:
      - ".tsv"
    description: "The input SDRF file in .tsv format."

  - name: "asap_team_name"
    label: "ASAP Team Name"
    type: "text"
    default: "Alessi"
    description: "Name of the ASAP team."
  
  - name: "asap_lab_name"
    label: "ASAP Lab Name"
    type: "text"
    default: "Dario Alessi"
    description: "Name of the ASAP lab."

  - name: "pi_full_name"
    label: "PI Full Name"
    type: "text"
    default: "Dario R. Alessi"
    description: "Full name of the Principal Investigator."

  - name: "project_name"
    label: "Project Name"
    type: "text"
    default: ""
    description: "Official ASAP project name. Example: Mapping the LRRK2 Signalling Pathway and Its Interplay with Other Parkinson's Disease Components."

  - name: "project_description"
    label: "Project Description"
    type: "text"
    default: ""
    description: "Detailed description of the research project goals and scope."

  - name: "dataset_title"
    label: "Dataset Title"
    type: "text"
    default: ""
    description: "Title for the dataset, often matching the publication title. Example: Parkinson's VPS35[D620N] mutation induces LRRK2-mediated lysosomal association of RILPL1 and TMEM55B"

  - name: "dataset_description"
    label: "Dataset Description"
    type: "text"
    default: ""
    description: "Description of the dataset including experimental details. Auto-detected from SDRF if empty."

  - name: "dataset_name"
    label: "Dataset Name"
    type: "text"
    default: ""
    description: "Short identifier for the dataset. Example: VPS35_D620N_Brain_LysoIP"

  - name: "pi_email"
    label: "PI Email"
    type: "text"
    default: ""
    description: "Email address of the Principal Investigator. Example: d.r.alessi@dundee.ac.uk"

  - name: "contributor_names"
    label: "Contributor Names"
    type: "text"
    default: ""
    description: "Comma-separated list of all contributors. Example: Prosenjit Pal, Matthew Taylor, Pui Yiu Lam"

  - name: "submitter_name"
    label: "Submitter Name"
    type: "text"
    default: ""
    description: "Name of the person submitting the data. Example: Dr. Raja Nirujogi"

  - name: "submitter_email"
    label: "Submitter Email"
    type: "text"
    default: ""
    description: "Email of the data submitter. Example: r.nirujogi@dundee.ac.uk"

  - name: "asap_grant_id"
    label: "ASAP Grant ID"
    type: "text"
    default: ""
    description: "ASAP grant identifier. Example: ASAP-000463"

  - name: "other_funding_source"
    label: "Other Funding Source"
    type: "text"
    default: ""
    description: "Additional funding sources beyond ASAP. Use NA if none."

  - name: "publication_doi"
    label: "Publication DOI"
    type: "text"
    default: ""
    description: "DOI of the associated publication. Example: 10.1126/sciadv.adj1205"

  - name: "publication_pmid"
    label: "Publication PMID"
    type: "text"
    default: ""
    description: "PubMed ID of the associated publication. Example: 38091401"

  - name: "number_samples"
    label: "Number of Samples"
    type: "text"
    default: ""
    description: "Total number of samples. Auto-detected from SDRF if empty."

  - name: "sample_types"
    label: "Sample Types"
    type: "text"
    default: ""
    description: "Types of samples in the dataset. Example: Mouse Brain. Auto-detected from SDRF if empty."

  - name: "types_of_samples"
    label: "Types of Samples"
    type: "text"
    default: ""
    description: "Assay types in the dataset. Example: Proteomics (Organelle-IP). Auto-detected from SDRF if empty."

  - name: "metadata_tables"
    label: "Metadata Tables"
    type: "text"
    default: "SDRF.tsv"
    description: "Comma-separated list of metadata files. Example: SDRF.tsv, intervention.csv, STUDY.csv"

  - name: "dua_version"
    label: "DUA Version"
    type: "text"
    default: ""
    description: "Data Use Agreement version. Use NA if not applicable."

  - name: "pi_orcid"
    label: "PI ORCID"
    type: "text"
    default: ""
    description: "ORCID identifier of the PI. Example: 0000-0002-2140-9185"

  - name: "pi_google_scholar_id"
    label: "PI Google Scholar ID"
    type: "text"
    default: ""
    description: "Google Scholar ID of the PI. Use NA if not available."

  - name: "preprocessing_references"
    label: "Preprocessing References"
    type: "text"
    default: ""
    description: "References for data preprocessing methods. Use NA if not applicable."

  - name: "metadata_version_date"
    label: "Metadata Version Date"
    type: "text"
    default: ""
    description: "Date of metadata version. Format: M/D/YYYY. Example: 4/7/2025"

  - name: "alternate_dataset_id"
    label: "Alternate Dataset ID"
    type: "text"
    default: ""
    description: "External dataset identifier such as ProteomeXchange ID. Example: PXD042502"

execution:
  requirements:
    pythonRequirementsFile: "requirements.txt"
  argsMapping:
    sdrf_file: "--sdrf_file"
    asap_team_name: "--asap_team_name"
    asap_lab_name: "--asap_lab_name"
    pi_full_name: "--pi_full_name"
    project_name: "--project_name"
    project_description: "--project_description"
    dataset_title: "--dataset_title"
    dataset_description: "--dataset_description"
    dataset_name: "--dataset_name"
    pi_email: "--pi_email"
    contributor_names: "--contributor_names"
    submitter_name: "--submitter_name"
    submitter_email: "--submitter_email"
    asap_grant_id: "--asap_grant_id"
    other_funding_source: "--other_funding_source"
    publication_doi: "--publication_doi"
    publication_pmid: "--publication_pmid"
    number_samples: "--number_samples"
    sample_types: "--sample_types"
    types_of_samples: "--types_of_samples"
    metadata_tables: "--metadata_tables"
    dua_version: "--dua_version"
    pi_orcid: "--pi_orcid"
    pi_google_scholar_id: "--pi_google_scholar_id"
    preprocessing_references: "--preprocessing_references"
    metadata_version_date: "--metadata_version_date"
    alternate_dataset_id: "--alternate_dataset_id"
  outputDir: "--output_dir"

outputs:
  - name: "output_dir"
    path: "."
    type: "data"
    description: "Output directory containing exported ASAP files"

example:
  enabled: true
  values:
    sdrf_file: "examples/Alessi_LysoIP_Brain_SDRF.tsv"
    asap_team_name: "Alessi"
    asap_lab_name: "Dario Alessi"
    pi_full_name: "Dario R. Alessi"
    pi_email: "d.r.alessi@dundee.ac.uk"
    project_name: "Mapping the LRRK2 Signalling Pathway and Its Interplay with Other Parkinson's Disease Components."
    dataset_title: "Parkinson's VPS35[D620N] mutation induces LRRK2-mediated lysosomal association of RILPL1 and TMEM55B"
    dataset_name: "VPS35_D620N_Brain_LysoIP"
    contributor_names: "Prosenjit Pal, Matthew Taylor, Pui Yiu Lam, Francesca Tonelli, Chloe A. Hecht, Pawel Lis, Raja S. Nirujogi, Toan K. Phung, Melanie Wightman, Thomas Macartney, Suzanne R. Pfeffer"
    submitter_name: "Dr. Raja Nirujogi"
    submitter_email: "r.nirujogi@dundee.ac.uk"
    asap_grant_id: "ASAP-000463"
    publication_doi: "10.1126/sciadv.adj1205"
    publication_pmid: "38091401"
    pi_orcid: "0000-0002-2140-9185"
    alternate_dataset_id: "PXD042502"
